services:
  keyv_postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    command: postgres -c 'max_connections=200'
    environment:
      POSTGRES_DB: keyv_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 5432:5432/tcp
  keyv_postgres_1:
    build:
      context: ../packages/postgres
      dockerfile: Dockerfile.ssl
    command: postgres -c 'max_connections=200' -c 'ssl=on' -c 'ssl_cert_file=/keyv_postgres_ssl/server.crt' -c 'ssl_key_file=/keyv_postgres_ssl/server.key' -c 'hba_file=/keyv_postgres_ssl/pg_hba.conf' -c "listen_addresses=*"
    environment:
      POSTGRES_DB: keyv_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 5433:5432/tcp
  keyv_mysql:
    image: mysql/mysql-server:8.0.32@sha256:d6c8301b7834c5b9c2b733b10b7e630f441af7bc917c74dba379f24eeeb6a313
    command: [ "mysqld",
               "--character-set-server=utf8mb4",
               "--collation-server=utf8mb4_unicode_ci",
               "--bind-address=0.0.0.0",
               "--default_authentication_plugin=mysql_native_password" ]
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_DATABASE: keyv_test
      MYSQL_USER: mysql
      MYSQL_ROOT_HOST: '%'
  keyv_mysql_1:
    image: mysql/mysql-server:8.0.32@sha256:d6c8301b7834c5b9c2b733b10b7e630f441af7bc917c74dba379f24eeeb6a313
    command: [ "mysqld",
               "--character-set-server=utf8mb4",
               "--collation-server=utf8mb4_unicode_ci",
               "--require_secure_transport=ON",
               "--bind-address=0.0.0.0",
               "--ssl-ca=/etc/certs/ca.pem",
               "--ssl-cert=/etc/certs/server-cert.pem",
               "--ssl-key=/etc/certs/server-key.pem",
               "--default_authentication_plugin=mysql_native_password" ]
    ports:
      - "3307:3306"
    volumes:
      - type: bind
        source: ../packages/mysql/test/certs
        target: /etc/certs/
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_DATABASE: keyv_test
      MYSQL_ROOT_HOST: '%'
  keyv_valkey:
    image: valkey/valkey:9.1.2-trixie@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    command: redis-server --port 6370
    environment:
      REDIS_HOST: redis
    ports:
      - 6370:6370
  keyv_redis:
    image: redis:8.10.2-trixie@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    environment:
      REDIS_HOST: redis
    ports:
      - 6379:6379
  keyv_redis_1:
    image: redis:8.10.2-trixie@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: redis-server --port 0 --tls-port 6380 --tls-cert-file /tls/redis.crt --tls-key-file /tls/redis.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no
    environment:
      REDIS_HOST: redis
    ports:
      - 6380:6380
    volumes:
      - ../packages/redis/tls:/tls
  keyv_mongo:
    image: mongo:8.3.11@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
    restart: always
    ports:
      - 27017:27017
  keyv_memcached:
    image: memcached:1.6.45-trixie@sha256:75c93cc91e76853da7c029e74d6e8dbd44774dd3713c93be8cd1971ad26120a4
    ports:
      - "11211:11211"
  keyv_etcd:
    image: registry.k8s.io/etcd:3.5.33-0@sha256:89e9d4e344864374bf141d10ac90034e50647f58498ef0b5f0d6e4fd328c58b9
    command:
      - etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
    ports:
      - 2379:2379
      - 2380:2380
  keyv_dynamo:
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    ports:
      - 8000:8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ "$(curl -s -o /dev/null -I -w ''%{http_code}'' http://localhost:8000)" == "400" ]; then exit 0; else exit 1; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
