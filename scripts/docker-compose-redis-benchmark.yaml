name: keyv-redis-benchmark
networks:
  default:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
services:
  redis:
    image: redis:8.10.2-trixie@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    command: ["redis-server", "--io-threads", "4", "--save", ""]
    cpuset: "${BENCH_SERVER_CPUS:-}"
  valkey:
    image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ["valkey-server", "--io-threads", "4", "--save", ""]
    cpuset: "${BENCH_SERVER_CPUS:-}"
  kividb:
    image: kividb/kividb:v1.2.2@sha256:8853c7b1e73e604502fd584533440cb1205ae311fe805d520543b4e85a4b71e9
    command: ["--port", "6379", "--protected-mode", "no", "--threads", "4"]
    cpuset: "${BENCH_SERVER_CPUS:-}"
  client:
    build:
      context: ../storage/redis/benchmark/dist
      dockerfile_inline: |
        FROM node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
        COPY --chmod=0555 *.mjs /benchmark/runner/
    depends_on: [redis, valkey, kividb]
    cpuset: "${BENCH_CLIENT_CPUS:-}"
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      REDIS_URI: redis://redis:6379
      VALKEY_URI: redis://valkey:6379
      KIVIDB_URI: redis://kividb:6379
    working_dir: /benchmark
    command: ["node", "runner/combined.mjs"]
