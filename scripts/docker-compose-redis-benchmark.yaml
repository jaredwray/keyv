name: keyv-redis-benchmark
services:
  redis:
    image: redis:8.10.2-trixie@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    command: ["redis-server", "--io-threads", "4", "--save", ""]
    cpuset: "${BENCH_SERVER_CPUS:-}"
    ports:
      - "127.0.0.1:16379:6379"
  valkey:
    image: valkey/valkey:9.1.3-trixie@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ["valkey-server", "--io-threads", "4", "--save", ""]
    cpuset: "${BENCH_SERVER_CPUS:-}"
    ports:
      - "127.0.0.1:16370:6379"
  kividb:
    image: kividb/kividb:v1.2.2@sha256:8853c7b1e73e604502fd584533440cb1205ae311fe805d520543b4e85a4b71e9
    command: ["--port", "6379", "--protected-mode", "no", "--threads", "4"]
    cpuset: "${BENCH_SERVER_CPUS:-}"
    ports:
      - "127.0.0.1:16381:6379"
