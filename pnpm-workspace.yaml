packages:
  - 'core/*'
  - 'serialization/*'
  - 'compression/*'
  - 'encryption/*'
  - 'storage/*'
  - 'website'
allowBuilds:
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  sharp: false
  sqlite3: true
  workerd: true
# 7 days minimum release age (minutes). Fail closed if publish time is missing
# or the only matching version is too new.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
blockExoticSubdeps: true
# semver@5.7.2 fails trustPolicy: no-downgrade (no provenance;
# later versions of the same package have attestations). Pin to a version that
# already meets the gate — do not exclude first-party packages.
overrides:
  semver@5.7.2: 7.7.3
