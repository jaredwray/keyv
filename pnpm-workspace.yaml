packages:
  - 'core/*'
  - 'serialization/*'
  - 'compression/*'
  - 'encryption/*'
  - 'storage/*'
  - 'website'
allowBuilds:
  better-sqlite3: true
  "@valkey/valkey-glide": false
  protobufjs: false
  esbuild: true
  msgpackr-extract: true
  sharp: false
  sqlite3: true
  workerd: true
# 7 days minimum release age (minutes). Fail closed if publish time is missing
# or the only matching version is too new.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
blockExoticSubdeps: true
# semver@5.7.2 fails trustPolicy: no-downgrade (no provenance;
# later versions of the same package have attestations). Pin to a version that
# already meets the gate — do not exclude first-party packages.
#
# High and critical advisories. Selectors stay on the same major so callers
# keep a compatible API. Each pin is old enough for minimumReleaseAge.
# vitest is already a direct devDependency at ^5.0.5, which is above 3.2.6.
#
# miniflare 4 pins sharp at 0.35.2. No 4.x release depends on sharp >= 0.35.5,
# and miniflare 5 is still prerelease, so that parent cannot be bumped.
overrides:
  semver@5.7.2: 7.8.5
  # 7.30.0 and 8.11.2 are still inside the Oct 15 advisories fixed by
  # 7.30.1 and 8.12.2. miniflare 4 pins undici at 7.28.0 exactly.
  # >=7.30.1 resolves to 8.12.3, so the 7.x selector lifts that pin there.
  "undici@>=7 <7.29.1": 8.12.3
  "sharp@>=0.35 <0.35.5": 0.35.5
