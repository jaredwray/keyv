name: bun

on:
  workflow_dispatch:
  push:
    branches: [v5]
  pull_request:
    branches: [v5]

permissions:
  contents: read

jobs:
  bun-test:
    runs-on: ubuntu-latest
    name: bun
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Start Services
        run: pnpm test:services:start

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Keyv Tests with Bun
        working-directory: packages/keyv
        run: bun run vitest run --coverage
