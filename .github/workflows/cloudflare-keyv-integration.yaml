name: cloudflare-keyv-integration

# Integration test for @keyv/cloudflare-kv against the REAL Cloudflare KV REST API.
# It runs when the package changes (pull requests and pushes to main) so we notice if Cloudflare
# changes the API our local Miniflare/bridge emulation stands in for. The test self-skips when the
# secrets below are absent, so it never fails on forks or when secrets are not configured.
#
# Required repository secrets:
#   CLOUDFLARE_ACCOUNT_ID       - the Cloudflare account ID that owns the KV namespace
#   CLOUDFLARE_KV_NAMESPACE_ID  - the KV namespace ID (not the binding name)
#   CLOUDFLARE_API_TOKEN        - an API token with the "Workers KV Storage" Edit permission

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "storage/cloudflare-kv/**"
      - ".github/workflows/cloudflare-keyv-integration.yaml"
  pull_request:
    paths:
      - "storage/cloudflare-kv/**"
      - ".github/workflows/cloudflare-keyv-integration.yaml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: cloudflare-keyv-integration
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.1"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build Keyv
        run: pnpm build:keyv

      - name: Run Live Integration Tests
        working-directory: storage/cloudflare-kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm test:live
