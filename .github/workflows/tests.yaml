name: tests

on:
  workflow_dispatch:
  push:
    branches: [v5]
  pull_request:
    branches: [v5]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    name: node-${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # pnpm 12 (packageManager) is a native binary and supports Node 20, so
      # every matrix job can use action-setup. pnpm 11 required Node >= 22.13.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Start Services
        run: chmod +x ./scripts/test-services-start.sh && ./scripts/test-services-start.sh

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test Packages
        run: pnpm test
